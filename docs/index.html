
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPA Installer</title>
<style>
body {
  background: #101114;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 70px 20px;
}
.container {
  max-width: 380px;
  margin: auto;
  background: #202127;
  padding: 30px 20px;
  border-radius: 18px;
}
.install-button {
  display: block;
  box-sizing: border-box;
  background: #1685ff;
  color: white;
  text-decoration: none;
  border-radius: 12px;
  padding: 15px 35px;
  font-size: 18px;
  width: 100%;
  margin-top: 20px;
}
.install-button[aria-disabled="true"] {
  opacity: .5;
  pointer-events: none;
}
p { color: #bbb; }
</style>
</head>
<body>
<div class="container">
  <h2>IPA Installer</h2>
  <p id="status">Your app is ready to install.</p>
  <a id="install" class="install-button" href="#">Install</a>
</div>

<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const manifest = params.get("m");
  const button = document.getElementById("install");
  const status = document.getElementById("status");

  if (!manifest || !/^https:\\/\\//i.test(manifest)) {
    status.textContent = "Install link is invalid or missing.";
    button.removeAttribute("href");
    button.setAttribute("aria-disabled", "true");
    return;
  }

  // Set a real itms-services link before the user taps. This avoids
  // relying on a JavaScript redirect during the tap gesture on iOS.
  button.href =
    "itms-services://?action=download-manifest&url=" +
    encodeURIComponent(manifest);
})();
</script>
</body>
</html>
